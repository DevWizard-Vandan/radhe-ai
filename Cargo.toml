[package]
name = "radhe-ai"
version = "0.1.0"
edition = "2021"
authors = ["Vandan Sharma"]
description = "A tiny offline terminal AI assistant for students"
license = "MIT"
repository = "https://github.com/DevWizard-Vandan/radhe-ai"
readme = "README.md"
keywords = ["cli", "offline", "ai", "student", "llm"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "radhe"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
